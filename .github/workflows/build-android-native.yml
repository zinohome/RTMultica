name: Build Multica Native Android (React Native)

# Builds a signed native Android APK from upstream apps/mobile (Expo/RN),
# overlaid to point at the self-hosted server. Separate from the Capacitor
# shell workflow (build-android.yml) — this one produces the true-native app.

on:
  workflow_dispatch:
  push:
    branches: [main, android-native-build]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-native.yml'

permissions:
  contents: write

env:
  # Upstream tag to build against — keep in sync with mobile/build-android.sh.
  MULTICA_VERSION: v0.4.3
  PNPM_VERSION: 10.28.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout RTMultica
        uses: actions/checkout@v4

      - name: Clone upstream multica (pinned tag)
        run: |
          git clone --depth 1 --branch "$MULTICA_VERSION" \
            https://github.com/multica-ai/multica.git projects/multica

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply RTMultica overlay
        run: |
          cp mobile/overlay/apps/mobile/app.config.ts   projects/multica/apps/mobile/app.config.ts
          cp mobile/overlay/apps/mobile/.env.production  projects/multica/apps/mobile/.env.production

      - name: Export server URLs into environment
        run: |
          # EXPO_PUBLIC_* must be in the environment so Metro inlines them into
          # the release bundle. Single source of truth = the overlay .env file.
          grep -E '^EXPO_PUBLIC_' mobile/overlay/apps/mobile/.env.production >> "$GITHUB_ENV"
          echo "APP_ENV=production" >> "$GITHUB_ENV"

      - name: Install dependencies (monorepo)
        working-directory: projects/multica
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Expo prebuild (android)
        working-directory: projects/multica/apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Decode keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > "${{ github.workspace }}/keystore.jks"

      - name: Inject release signing + arm64 ABI pin
        run: |
          node mobile/scripts/inject-android-signing.mjs \
            projects/multica/apps/mobile/android

      - name: Assemble release APK
        working-directory: projects/multica/apps/mobile/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          VERSION="${MULTICA_VERSION#v}-$(date +%Y%m%d-%H%M)"
          APK_DIR="projects/multica/apps/mobile/android/app/build/outputs/apk/release"
          mkdir -p dist
          n=0
          for apk in "$APK_DIR"/*.apk; do
            [ -f "$apk" ] || continue
            cp "$apk" "dist/multica-rn-android-${VERSION}.apk"
            n=$((n+1))
          done
          if [ "$n" = 0 ]; then
            echo "No APK produced"; ls -R "$APK_DIR" || true; exit 1
          fi
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -lh dist/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multica-rn-android-${{ env.APK_VERSION }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish to android-native-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_VERSION: ${{ env.APK_VERSION }}
        run: |
          NOTES="## Multica 原生安卓版 (React Native)

          真原生客户端（非 WebView 套壳）。目标服务器: https://mtcsrv.naivehero.top:8443

          ### 安装
          1. 下载下方 APK
          2. 设置 → 安全 → 允许安装未知来源应用
          3. 打开 APK 安装

          - 包名: top.naivehero.multica.rn（与套壳版可并存）
          - 架构: arm64-v8a（适配 Xiaomi 14 Pro / Xiaomi Pad 5 Pro）
          - 构建: ${APK_VERSION}"

          gh release delete android-native-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-native-latest \
            --title "Multica Native Android (Latest Build)" \
            --notes "$NOTES" \
            dist/*.apk
