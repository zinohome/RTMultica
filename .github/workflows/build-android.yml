name: Build Multica Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > "${{ github.workspace }}/android/app/keystore.jks"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease

      - name: Collect APKs
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          APK_DIR="android/app/build/outputs/apk/release"
          mkdir -p dist
          # universal APK（平板 / 多架构通用）
          if [ -f "${APK_DIR}/app-universal-release.apk" ]; then
            cp "${APK_DIR}/app-universal-release.apk" "dist/multica-android-universal-${VERSION}.apk"
          fi
          # split APKs
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "${APK_DIR}/app-${ABI}-release.apk" ]; then
              cp "${APK_DIR}/app-${ABI}-release.apk" "dist/multica-android-${ABI}-${VERSION}.apk"
            fi
          done
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multica-android-${{ env.APK_VERSION }}
          path: dist/*.apk
          retention-days: 30

      - name: Update GitHub Release (android-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_VERSION: ${{ env.APK_VERSION }}
        run: |
          NOTES="## 安装方法
          1. 下载下方 APK 文件（不确定架构请选 universal）
          2. 手机/平板「设置 → 安全 → 允许安装未知来源应用」
          3. 打开 APK 安装

          构建时间: ${APK_VERSION}
          支持设备: Xiaomi 14 Pro (arm64-v8a) · Xiaomi Pad 5 Pro (universal)
          目标地址: https://mtc.naivehero.top:8443"

          gh release delete android-latest --yes 2>/dev/null || true
          gh release create android-latest \
            --title "Multica Android (Latest Build)" \
            --notes "$NOTES" \
            --latest \
            dist/*.apk
