name: Build Multica Android APK (Capacitor)

# Builds two Capacitor Android variants that install side by side on the same
# device (different applicationId each):
#   - mtc  → top.naivehero.multica      → https://mtc.naivehero.top:8443
#   - m349 → top.naivehero.multica.m349 → https://multica.m349.net
# The m349 variant's server/app identity lives in capacitor.config.m349.json;
# the mtc variant is the committed root capacitor.config.json (unchanged).

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'capacitor.config.m349.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: mtc
            app_id: top.naivehero.multica
            app_name: Multica
          - variant: m349
            app_id: top.naivehero.multica.m349
            app_name: Multica M349

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # mtc is the committed default (root capacitor.config.json / build.gradle
      # / strings.xml already match it) — only m349 needs patching before sync.
      - name: Apply m349 variant identity
        if: matrix.variant == 'm349'
        run: |
          cp capacitor.config.m349.json capacitor.config.json
          sed -i 's/applicationId "top.naivehero.multica"/applicationId "${{ matrix.app_id }}"/' android/app/build.gradle
          sed -i "s#<string name=\"app_name\">.*</string>#<string name=\"app_name\">${{ matrix.app_name }}</string>#" android/app/src/main/res/values/strings.xml
          sed -i "s#<string name=\"title_activity_main\">.*</string>#<string name=\"title_activity_main\">${{ matrix.app_name }}</string>#" android/app/src/main/res/values/strings.xml
          sed -i "s#<string name=\"package_name\">.*</string>#<string name=\"package_name\">${{ matrix.app_id }}</string>#" android/app/src/main/res/values/strings.xml
          sed -i "s#<string name=\"custom_url_scheme\">.*</string>#<string name=\"custom_url_scheme\">${{ matrix.app_id }}</string>#" android/app/src/main/res/values/strings.xml

      - name: Sync Capacitor Android
        run: |
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > "${{ github.workspace }}/android/app/keystore.jks"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Collect APKs
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          APK_DIR="android/app/build/outputs/apk/release"
          mkdir -p dist
          # universal APK（平板 / 多架构通用）
          if [ -f "${APK_DIR}/app-universal-release.apk" ]; then
            cp "${APK_DIR}/app-universal-release.apk" "dist/multica-${{ matrix.variant }}-android-universal-${VERSION}.apk"
          fi
          # split APKs
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "${APK_DIR}/app-${ABI}-release.apk" ]; then
              cp "${APK_DIR}/app-${ABI}-release.apk" "dist/multica-${{ matrix.variant }}-android-${ABI}-${VERSION}.apk"
            fi
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multica-${{ matrix.variant }}-apks
          path: dist/*.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all variant APKs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: multica-*-apks
          merge-multiple: true

      - name: Update GitHub Release (android-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          NOTES="## 安装方法
          1. 下载下方 APK（不确定型号选 universal）
          2. 设置 → 安全 → 允许安装未知来源应用
          3. 打开 APK 安装

          构建时间: ${VERSION}
          架构说明:
          - universal：适用所有设备（推荐，包含 Xiaomi Pad 5 Pro）
          - arm64-v8a：Xiaomi 14 Pro 等 64 位设备
          - armeabi-v7a：旧 32 位 ARM 设备
          - x86_64：Android 模拟器

          本次发布包含两个可同时安装的版本（包名不同，可共存于同一台设备）：
          - **mtc 版**（multica-mtc-*，包名 top.naivehero.multica）→ 目标服务器 https://mtc.naivehero.top:8443
          - **m349 版**（multica-m349-*，包名 top.naivehero.multica.m349）→ 目标服务器 https://multica.m349.net

          技术架构: Capacitor（内置 WebView，不依赖 Chrome）"

          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          RELEASE_ID=$(curl -sf -H "$AUTH" "$API/releases/tags/android-latest" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            curl -sf -X DELETE -H "$AUTH" "$API/releases/$RELEASE_ID" || true
          fi
          curl -sf -X DELETE -H "$AUTH" "$API/git/refs/tags/android-latest" || true
          gh release create android-latest \
            --title "Multica Android (Latest Build)" \
            --notes "$NOTES" \
            --latest \
            dist/*.apk
