name: Desktop Release

# Trigger: push a tag like v0.3.5 on main, or run manually
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (default: main)"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build mac DMGs (arm64 + x64)
    # macOS runner required — electron-builder cannot produce .dmg on Linux/Windows.
    # macos-latest = Apple Silicon (arm64); it can cross-compile x64 via Go CGO_ENABLED=0.
    runs-on: macos-latest

    steps:
      - name: Checkout RTMultica
        uses: actions/checkout@v4

      - name: Clone upstream multica
        run: |
          git clone --depth 1 --branch v0.3.3 https://github.com/multica-ai/multica.git projects/multica

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: projects/multica/server/go.mod
          cache-dependency-path: projects/multica/server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package-json-file: projects/multica/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/multica/pnpm-lock.yaml

      - name: Build arm64 + x64 DMGs
        working-directory: desktop
        env:
          # Disable code signing — internal unsigned builds, users run:
          #   xattr -dr com.apple.quarantine /Applications/Multica.app
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload DMGs as release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.dmg
          fail_on_unmatched_files: false

      - name: Upload DMGs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtmultica-desktop-dmgs
          path: desktop/dist/*.dmg
          if-no-files-found: warn
          retention-days: 14
